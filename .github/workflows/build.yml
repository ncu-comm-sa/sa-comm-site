name: Build Hugo Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dependencies
        run: |
          cd ./themes/tailbliss
          pnpm install

      - name: Build Hugo Site
        run: |
          cd ../..
          hugo --minify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-folder
          path: public/