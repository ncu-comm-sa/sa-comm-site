name: Build Hugo Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Build Environment
        run: |
          npm init -y
          
          # 直接在根目錄安裝 PostCSS 與 Tailwind v4 生態系。
          # 這樣做能完全繞過主題的 install.js 帶來的版本衝突，
          # 讓 NPM 自動為你配對「版本完全一致」的主程式與 Linux 底層引擎！
          npm install postcss postcss-cli tailwindcss @tailwindcss/postcss autoprefixer

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-folder
          path: public/