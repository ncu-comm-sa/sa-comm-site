name: Build Hugo Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dependencies
        run: |
          # 1. 根目錄：安裝 Hugo 必備的 PostCSS 外殼
          npm init -y
          npm install postcss postcss-cli
          
          # 2. 進入主題資料夾
          cd themes/tailbliss
          
          # 3. 完美套用你找到的解法！
          # 強制安裝 Linux x64 gnu 版本的核心引擎，並且不讓 npm 忽略它們。
          # 同時加上 --ignore-scripts 阻止作者的腳本把它們丟到根目錄。
          # 這樣主程式跟引擎就會完美地綁定在同一個 node_modules 裡了！
          npm install lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --ignore-scripts
          
          # 4. 正常安裝主題內的其他套件
          npm install --ignore-scripts

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-folder
          path: public/