name: Build Hugo Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dependencies (Follow Theme Author's Design)
        run: |
          # 1. 進入主題資料夾安裝，這會觸發 install.js
          # install.js 會自動在專案根目錄生成正確的 package.json (包含 Linux 專用引擎)
          cd themes/tailbliss
          npm install
          
          # 2. 退回專案根目錄
          cd ../../
          
          # 3. 最關鍵的遺漏步驟！
          # 根據 install.js 剛剛幫我們寫好的清單，實際下載這些底層依賴到根目錄
          npm install
          
          # 4. 補上 Hugo 呼叫所需的 PostCSS 殼（作者腳本沒包含這兩個）
          npm install postcss postcss-cli

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-folder
          path: public/