name: Build Hugo Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dependencies
        run: |
          # 1. 清除所有的 lock 檔，強迫在 Linux 伺服器重新解析套件
          find . -name "package-lock.json" -type f -delete
          rm -rf node_modules themes/tailbliss/node_modules

          # 2. 將主題的套件清單拉到根目錄，統一 Node.js 的尋找路徑
          cp themes/tailbliss/package.json ./package.json
          
          # 3. 關鍵魔法：--ignore-scripts
          # 這會略過 tailbliss 預設的 install.js，只乖乖下載套件，完美避開剛剛的找不到檔案錯誤
          npm install --ignore-scripts
          
          # 4. 安裝 Hugo 呼叫 PostCSS 所需的 CLI 工具
          npm install postcss postcss-cli autoprefixer --ignore-scripts

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public-folder
          path: public/